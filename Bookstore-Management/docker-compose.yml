version: '3.8'
services:
  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: bookstore_db
    ports:
      - "5433:5432"
    networks:
      - bookstore-network

  book-service:
    build: ./book-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/bookstore_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=secretpassword
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db
    networks:
      - bookstore-network

  inventory-service:
    build: ./inventory-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/bookstore_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=secretpassword
    ports:
      - "8082:8082"
    depends_on:
      - postgres-db
    networks:
      - bookstore-network

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - book-service
      - inventory-service
    networks:
      - bookstore-network

networks:
  bookstore-network:
    driver: bridge
